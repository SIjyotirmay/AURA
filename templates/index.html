<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Job Agent</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🤖 Agentic AI Job Search</h1>
        <p>Find the latest AI-matched jobs based on your skills</p>
    </div>

    <div class="form-card">
        <form action="/search" method="POST">
            
            <div class="form-group">
                <label>👤 Name</label>
                <input type="text" name="name" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label>🧠 Skills (comma separated)</label>
                <input type="text" name="skills" 
                       placeholder="Python, Machine Learning, Flask" required>
            </div>

            <div class="form-group">
                <label>📍 Preferred Location</label>
                <input type="text" name="location" value="India" required>
            </div>

            <button type="submit">🚀 Find Matched Jobs</button>
        </form>
    </div>
</div>

</body>
</html>
